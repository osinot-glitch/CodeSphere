<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSphere</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>

<body>
    <header>
        <div>
            <a href="index.html">
            <h1 data-aos="fade-right" data-aos-delay="100" data-aos-duration="800">CodeSphere</h1>
        </a>
        </div>
        <a href="index.html" data-aos="fade-right" data-aos-delay="100" data-aos-duration="800">Home</a>
        <a href="courses.html" data-aos="fade-right" data-aos-delay="150" data-aos-duration="800">Courses</a>
        <a href="about.html" data-aos="fade-right" data-aos-delay="200" data-aos-duration="800">About</a>
        <a href="pricing.html" data-aos="fade-right" data-aos-delay="250" data-aos-duration="800">Pricing</a>
        <a href="contact.html" data-aos="fade-right" data-aos-delay="300" data-aos-duration="800">Contact</a>
        <div data-aos="fade-right" data-aos-delay="300" data-aos-duration="1000">
            <a href="contact.html">
                <button>Start Learning</button>
            </a>
        </div>
    </header>

    <main class="contact">
        <div class="get" data-aos="fade-right" data-aos-delay="100" data-aos-duration="1000">
            <h1 data-aos="fade-right" data-aos-delay="100" data-aos-duration="1000">Get in Touch</h1>
            <h2 data-aos="fade-right" data-aos-delay="200" data-aos-duration="800">Email</h2>
            <p data-aos="fade-right" data-aos-delay="300" data-aos-duration="800">Info@codeshpere.com</p>
            <h2 data-aos="fade-right" data-aos-delay="400" data-aos-duration="800">Phone</h2>
            <p data-aos="fade-right" data-aos-delay="500" data-aos-duration="800">+992 90 123 4567</p>
            <h2 data-aos="fade-right" data-aos-delay="600" data-aos-duration="800">Address</h2>
            <p data-aos="fade-right" data-aos-delay="700" data-aos-duration="800">Dushanbe, Tajikistan </p>
        </div>
        <div class="send" data-aos="fade-left" data-aos-delay="100" data-aos-duration="1000">
            <h1 data-aos="fade-left" data-aos-delay="100" data-aos-duration="1000">Send Us a Message</h1>
   <form>
    <input type="text" id="name" required placeholder="Your Name" data-aos="fade-left" data-aos-delay="200" data-aos-duration="1000">
    <input type="email" id="email" required placeholder="Your Email" data-aos="fade-left" data-aos-delay="300" data-aos-duration="1000"><br>
    <input type="text" id="subject" required placeholder="Subject" data-aos="fade-left" data-aos-delay="400" data-aos-duration="1000"><br>
    <textarea id="Message" rows="5" cols="72" data-aos="fade-left" data-aos-delay="500" data-aos-duration="1000">Message</textarea><br>
    <input type="submit" value="Send Message" id="submit" data-aos="fade-left" data-aos-delay="600" data-aos-duration="1000">
   </form>
        </div>
    </main>

    <footer data-aos="zoom-out" data-aos-delay="100" data-aos-duration="1000">
        <div>
            <h1>CodeSphere</h1>
            <p>Learn. Code. Build. Succeed.</p>
        </div>

            <h2>Navigation</h2>
            <a href="index.html">Home</a>

            <a href="about.html">About</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html">Contact</a>
        </div>
        <div>
            <h3>&copy; 2026 CodeSphere. All right reserved.</h3>
        </div>
    </footer>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init((once = true));
    </script>
</body>

</html>
